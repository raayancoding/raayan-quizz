name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update GitHub Releases and attach the APK

jobs:
  test:
    name: Tests (JS syntax, quiz JSON, bias gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

  apk:
    name: Build APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Read version from package.json
        id: ver
        run: |
          echo "name=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Install deps, build www/ and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Install Android SDK packages (runner has the SDK preinstalled)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PappVersionName="${{ steps.ver.outputs.name }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}"

      - name: Rename APK
        run: |
          mkdir -p dist
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" "dist/raayan-quizz-v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.code }}.apk"
          # stable names for the release page (replaced on every publish)
          cp "$APK" "dist/raayan-quizz-v${{ steps.ver.outputs.name }}.apk"
          cp "$APK" "dist/raayan-quizz-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: raayan-quizz-v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.code }}
          path: dist/raayan-quizz-v${{ steps.ver.outputs.name }}-build${{ steps.ver.outputs.code }}.apk
          retention-days: 30

      # Every push to the default branch publishes/updates the release for the current
      # package.json version (tag v<version> is created at this commit if missing).
      # Bump the version in package.json to start a new release; pushing a v* tag also works.
      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: Raayan Quizz v${{ steps.ver.outputs.name }}
          body: |
            Android debug APK built from `${{ github.sha }}` (build ${{ steps.ver.outputs.code }}).

            - **raayan-quizz-latest.apk** — always the newest build of this version
            - **raayan-quizz-v${{ steps.ver.outputs.name }}.apk** — same file, versioned name

            Install: download on the phone → open → allow “install from this source”. Web version: https://raayancoding.github.io/raayan-quizz/
          files: |
            dist/raayan-quizz-v${{ steps.ver.outputs.name }}.apk
            dist/raayan-quizz-latest.apk
          make_latest: true
          generate_release_notes: true
